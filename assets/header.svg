<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Amjath Ali — Full-Stack Engineer">
  <style>
    .mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: 'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <clipPath id="card"><rect width="1000" height="330" rx="14"/></clipPath>
    <clipPath id="p0"><rect x="40" y="196" height="34" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;255;255;0;0" keyTimes="0;.1;.2;.2375;1"/></rect></clipPath>
    <clipPath id="p1"><rect x="40" y="196" height="34" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;532;532;0;0" keyTimes="0;.25;.35;.45;.4875;1"/></rect></clipPath>
    <clipPath id="p2"><rect x="40" y="196" height="34" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;347;347;0;0" keyTimes="0;.5;.6;.7;.7375;1"/></rect></clipPath>
    <clipPath id="p3"><rect x="40" y="196" height="34" width="0"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;466;466;0;0" keyTimes="0;.75;.85;.95;.9875;1"/></rect></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="330" fill="#0F151D"/>
    <rect x="-250" y="0" width="250" height="2" fill="#F5A524">
      <animate attributeName="x" from="-250" to="1000" dur="3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="24" cy="24" r="6" fill="#3A4556"/>
    <circle cx="44" cy="24" r="6" fill="#3A4556"/>
    <circle cx="64" cy="24" r="6" fill="#3A4556"/>
    <text x="88" y="29" class="mono" font-size="13" fill="#8B98A9">~/arfaz77 — zsh</text>
    <rect x="0" y="47" width="1000" height="1" fill="#263040"/>

    <text x="40" y="92" class="mono" font-size="15" fill="#8B98A9"><tspan fill="#F5A524">❯</tspan> whoami</text>
    <text x="38" y="164" class="sans" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#F4F7FA">Amjath Ali</text>

    <g class="mono" font-size="22" fill="#C9D3DE">
      <text x="40" y="221" clip-path="url(#p0)">Full-Stack Engineer</text>
      <text x="40" y="221" clip-path="url(#p1)">I design systems that don't drop events.</text>
      <text x="40" y="221" clip-path="url(#p2)">Outbox pattern enthusiast.</text>
      <text x="40" y="221" clip-path="url(#p3)">Civil engineer → backend architect.</text>
    </g>
    <rect x="40" y="202" width="11" height="24" fill="#F5A524">
      <animate attributeName="x" dur="16s" repeatCount="indefinite" values="44;295;295;44;44;572;572;44;44;387;387;44;44;506;506;44;44" keyTimes="0;.1;.2;.2375;.25;.35;.45;.4875;.5;.6;.7;.7375;.75;.85;.95;.9875;1"/>
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;0" keyTimes="0;.5" calcMode="discrete"/>
    </rect>

    <text x="40" y="272" class="mono" font-size="15" fill="#8B98A9"><tspan fill="#F5A524">❯</tspan> uptime</text>
    <text x="40" y="298" class="mono" font-size="15" fill="#C9D3DE">3 yrs, 0 lost events, load average: <tspan fill="#3DD6C4">ElysiaJS 0.62 · Postgres 0.48 · coffee 1.00</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="329" rx="14" fill="none" stroke="#263040"/>
</svg>
